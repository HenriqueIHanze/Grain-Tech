<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- fundo -->
  <rect width="600" height="400" fill="#eef0e6"/>

  <!-- áreas verdes (parques) -->
  <rect x="40" y="40" width="120" height="80" rx="14" fill="#cfe3c4"/>
  <rect x="440" y="250" width="120" height="100" rx="14" fill="#cfe3c4"/>
  <rect x="70" y="270" width="90" height="70" rx="14" fill="#cfe3c4"/>

  <!-- rio -->
  <path d="M0 330 C150 280, 250 380, 400 320 S560 300, 600 310" stroke="#bcd6e6" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- ruas principais -->
  <g stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round">
    <line x1="0" y1="190" x2="600" y2="190"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="0" y1="60" x2="600" y2="330"/>
  </g>

  <!-- ruas menores -->
  <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="0" y1="110" x2="600" y2="110"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
  </g>

  <!-- marcador da sede -->
  <circle cx="300" cy="190" r="26" fill="#e0693e" opacity="0.25"/>
  <circle cx="300" cy="190" r="12" fill="#e0693e" stroke="#ffffff" stroke-width="4"/>

  <!-- textos -->
  <text x="300" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1c3328">GrainTech</text>
  <text x="300" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4a4f47">Campinas, SP</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
