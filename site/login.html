<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrainTech - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site/css/login.css">
</head>
<body>

  <main class="pagina">

    <!-- Lado esquerdo -->
    <section class="boas-vindas">
      <h1>Bem-Vindo a</h1>
      <img class="logo-grande" src="../img/graintech.png" alt="GrainTech">
      <h3>Gestão inteligente para o <br>
        armazenamento de grãos</h3>
    </section>

    <!-- Cartão de login -->
    <section class="cartao">

      <img class="logo-pequena" src="../img/Container.png" alt="GrainTech">

      <div class="abas">
        <button class="aba ativa">Login</button>
        <button class="aba link-limpo"><a class="link-limpo" href="../site/cadastro.html">Cadastro</a></button>
      </div>

      <p class="chamada">
        O controle total da sua armazenagem começa aqui.<br>
        Crie sua conta e evite desperdícios na sua safra.
      </p>

      <hr>

      <div class="formulario">
        <div class="campo">
          <input type="email" placeholder="Insira seu Email">
        </div>

        <div class="campo">
          <input type="password" placeholder="Insira sua Senha">
        </div>

        <button class="botao-login">Login</button>
      </div>

      <p class="esqueci">Esqueceu a senha? <a href="../site/recSenha.html">Clique aqui</a></p>
    </section>

  </main>

</body>
</html>
