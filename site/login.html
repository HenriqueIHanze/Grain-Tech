<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrainTech - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site/css/login.css">
</head>

<body>

  <main class="pagina">
    <div>
      <a href="../siteInstitucional/inicio.html" class="btn-saida"><img src="../img/saida.svg">Sair</a>
    </div>

    <!-- Lado esquerdo -->
    <section class="boas-vindas">
      <h1>Bem-Vindo a</h1>
      <img class="logo-grande" src="../img/graintech.png" alt="GrainTech">
      <h3>Gestão inteligente para o <br>
        armazenamento de grãos</h3>
    </section>

    <!-- Cartão de login -->
    <section class="cartao">

      <img class="logo-pequena" src="../img/Container.png" alt="GrainTech">

      <div class="abas">
        <button class="aba ativa">Login</button>
        <button class="aba link-limpo"><a class="link-limpo" href="../site/cadastro.html">Cadastro</a></button>
      </div>

      <p class="chamada">
        O controle total da sua armazenagem começa aqui.<br>
        Entre com sua conta e evite desperdícios na sua safra.
      </p>

      <hr>

      <div class="formulario">
        <div class="campo">
          <input type="email" placeholder="Insira seu Email" id="email_campo">
        </div>

        <div class="campo">
          <input type="password" placeholder="Insira sua Senha" id="senha_campo">
        </div>

        <button class="botao-login" onclick="conferir()">Login</button>
      </div>

    </section>

  </main>

</body>

</html>

<script>

  function conferir() {

    let campo_email = email_campo.value;
    let campo_senha = senha_campo.value;
    let email = "admin123@sptech.school";
    let senha = "senha.123";

    if (campo_email != email) {

      alert("Email inválido");
    } else if (campo_senha != senha) {

      alert("Senha inválida");
    } else if (email == campo_email && senha == campo_senha) {

      window.location.href = "dashboard.html";
    }

  }
</script>
