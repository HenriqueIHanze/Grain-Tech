<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Cadastro</title>
</head>

<body>

    <div class="principal">

        <div class="bem-vindo">
            <h1>Bem-vindo à</h1>
            <img class="imagem1" src="../img/graintech.png">
            <h1>Gestão inteligente para o <br>
                armazenamento de grãos</h1>
        </div>
        <div class="cadastro">
            <div class="centro">
                <img class="imagem2" src="../img/Container.png">
                <div class="trocar_cadastro">
                    <div class="nao_selecionado"><a href="login.html">Login</a></div>
                    <div class="selecionado">Cadastro</div>
                </div>
                <p>O controle total da sua armazenagem começa aqui.<br>
                    Crie sua conta e evite desperdícios na sua safra.</p>
                <div class="linha"></div>
                <div class="campo">
                    <input id="ipt_nome" type="text" placeholder="Nome Completo" />
                </div>
                <div class="campo">
                    <input id="ipt_cpf" type="text" placeholder="CPF" />
                </div>
                <div class="campo">
                    <input id="ipt_email" type="text" placeholder="Email" />
                </div>
                <div class="campo">
                    <input id="ipt_senha" type="text" placeholder="Senha" />
                </div>
                <div class="campo">
                    <input id="ipt_confsenha" type="text" placeholder="Confirmar Senha" />
                </div>
                <div class="troca">
                    <button><-</button>
                            <p>1 / 2</p>
                            <button onclick="window.location.href='cadastro2.html'">-></button>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
