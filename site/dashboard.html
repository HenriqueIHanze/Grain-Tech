<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/dash.css">

            <div class="options">

                </div>
                <div class="icons">
                    <img src="">

                </div>
                <div class="icons">

                </div>
                <div class="Sair">
