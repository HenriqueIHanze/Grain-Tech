<!doctype html>
<html>

<head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <!----> <link rel="stylesheet" href="decorcao.css">
</head>

<body>

    <h1>Graphic</h1>
      <div class="caixa">
            <canvas id="DistanciaLivre" class="grafico"></canvas>
        </div>
    

    <script>
      var Distancia_Livre = new Chart(document.getElementById('DistanciaLivre').getContext('2d'), {    
            type: 'line',
            data: {
                datasets: [{
                    label: 'Distancia livre p/ segundo',
                    borderColor: '#63B1BC', 
                    backgroundColor: '#0762C8'
                }]
            },
            options: {
                scales: {
                    x: {
                        title: {
                        display: true,
                        text: 'segundos'
                        },
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Distancia livre<cm>'
                        },
                        beginAtZero: true
                    }
                }
            }
        });
      
        var paginacao = {};
        var tempo = {};

        function obterDados(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor));
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
           obterDados(Distancia_Livre, 'digital');
        }, 1000);

    </script>
</body>

</html>
